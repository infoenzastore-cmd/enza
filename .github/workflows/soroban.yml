name: Soroban contract

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "contracts/**"
      - ".github/workflows/soroban.yml"
  pull_request:
    branches: ["main", "feat/**"]
    paths:
      - "contracts/**"
      - ".github/workflows/soroban.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Format check
        working-directory: contracts/enza-checkout
        run: cargo fmt --all -- --check
      - name: Test contract
        working-directory: contracts/enza-checkout
        run: cargo test --locked
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.1.0
      - name: Build optimized WASM
        working-directory: contracts/enza-checkout
        run: stellar contract build
